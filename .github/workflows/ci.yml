name: Configurator CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Show SDK and runtimes
        shell: pwsh
        run: |
          dotnet --info
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet --list-sdks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet --list-runtimes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore solution
        shell: pwsh
        run: |
          dotnet restore .\Configurator.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Debug
        shell: pwsh
        run: |
          dotnet build .\Configurator.csproj --configuration Debug --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\tests\Configurator.Security.Tests\Configurator.Security.Tests.csproj --configuration Debug --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Debug tests
        shell: pwsh
        run: |
          dotnet test .\Configurator.slnx --configuration Debug --no-build --logger "trx;LogFileName=security-tests-debug.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build application
        shell: pwsh
        run: |
          dotnet build .\Configurator.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build security tests
        shell: pwsh
        run: |
          dotnet build .\tests\Configurator.Security.Tests\Configurator.Security.Tests.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run all tests
        shell: pwsh
        run: |
          dotnet test .\Configurator.slnx --configuration Release --no-build --logger "trx;LogFileName=security-tests.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: configurator-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
